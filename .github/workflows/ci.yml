name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  check:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: rawpickr/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: rawpickr/src-tauri -> target

      - name: Install dependencies
        working-directory: rawpickr
        run: pnpm install

      - name: TypeScript type check
        working-directory: rawpickr
        run: pnpm vue-tsc --noEmit

      - name: Rust check
        working-directory: rawpickr/src-tauri
        run: cargo check
